<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Fill the whole screen on phones and tablets; no pinch zoom, no double-tap zoom. viewport-fit=cover lets full
         screen use the camera cut-out area too; the game keeps its buttons clear of it (WebSafeArea, env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 「加入主畫面」: opened from the home screen the game has no address bar (iPhone: standalone; Android: full screen, landscape). -->
    <link rel="manifest" href="TemplateData/manifest.json">
    <link rel="apple-touch-icon" href="TemplateData/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a140f">
    <!-- The name players see (tab, loading screen, home-screen icon). Player Settings' product name stays "RPG2023" on purpose:
         Windows/Android builds and the editor keep their saved data under it. -->
    <meta name="apple-mobile-web-app-title" content="遊戲元長">
    <title>遊戲元長</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-loading-title">遊戲元長</div>
        <div id="unity-progress"><div id="unity-progress-fill"></div></div>
        <div id="unity-loading-text">載入中…</div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <!-- iPhone Safari cannot go full screen in a web page: on the login screen, a short note on adding the game to the
         home screen (shown by the game through window.gameHomeScreenTip; 「×」 hides it for good on this phone). -->
    <div id="home-tip" class="page-tip" hidden>
      <div id="home-tip-text">
        <b>想要全螢幕玩？</b>點 Safari 的「分享」<svg class="share" viewBox="0 0 20 24" aria-hidden="true"><path d="M10 2v13M5.5 6.5 10 2l4.5 4.5M6 10H3v12h14V10h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>→「加入主畫面」，再從主畫面打開遊戲，就不會有網址列了。
      </div>
      <button type="button" id="home-tip-close" class="page-tip-close" aria-label="關閉提示">×</button>
    </div>
    <!-- In-app browsers (LINE, Facebook, Instagram…) cannot go full screen: a short closable note instead of the
         full-screen button, shown while loading and on the login screen. LINE gets a link that reopens the game in the
         phone's own browser (?openExternalBrowser=1). -->
    <div id="inapp-tip" class="page-tip" hidden>
      <div id="inapp-tip-text">建議用 Chrome 或 Safari 開啟，可以全螢幕遊玩<a id="inapp-tip-open" href="#" hidden>改用瀏覽器開啟</a></div>
      <button type="button" id="inapp-tip-close" class="page-tip-close" aria-label="關閉提示">×</button>
    </div>
    <!-- Phone outside full screen (after leaving it): one tap goes back to full screen
         (Assets/Plugins/WebGL/WebFullscreen.jslib shows and hides it). -->
    <button type="button" id="fs-button" aria-label="全螢幕" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 7.5v-5h5M12.5 2.5h5v5M17.5 12.5v5h-5M7.5 17.5h-5v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>全螢幕</span>
    </button>
    <script>
      // Phone browsers: Unity types into its own HTML input and moves the caret with setSelectionRange. Inputs of type
      // email / number refuse that with an InvalidStateError, which would stop the whole game with an error box. The
      // game's fields are all plain text now (GameFlow/WebInputMode.cs); this guard keeps a refused caret move harmless.
      (function () {
        var proto = window.HTMLInputElement && HTMLInputElement.prototype;
        if (!proto || !proto.setSelectionRange || proto.setSelectionRange.__gameGuarded) return;
        var original = proto.setSelectionRange;
        var guarded = function () {
          try {
            return original.apply(this, arguments);
          } catch (e) {
            if (e && e.name === "InvalidStateError") return;   // this input type has no caret: nothing to move
            throw e;
          }
        };
        guarded.__gameGuarded = true;
        proto.setSelectionRange = guarded;
      })();

      // In-app browsers of chat / social apps: no full screen there (WebFullscreen.jslib reads this too).
      window.gameInAppBrowser = (function () {
        var ua = navigator.userAgent || "";
        var apps = [["LINE", /\bLine\//], ["Facebook", /FBAN|FBAV|FB_IAB|FBIOS|FB4A/], ["Instagram", /Instagram/],
          ["Threads", /Barcelona/], ["WeChat", /MicroMessenger/], ["KakaoTalk", /KAKAOTALK/],
          ["TikTok", /musical_ly|BytedanceWebview/], ["Snapchat", /Snapchat/], ["LinkedIn", /LinkedInApp/], ["App", /; wv\)/]];
        for (var i = 0; i < apps.length; i++) if (apps[i][1].test(ua)) return { inApp: true, name: apps[i][0], line: apps[i][0] === "LINE" };
        return { inApp: false, name: "", line: false };
      })();

      // Remember every Web Audio context the game creates, so the first touch / click can wake them all at once and the
      // first sound effect is never lost (see Assets/Plugins/WebGL/GameSfx.jslib). Contexts work exactly as before.
      (function () {
        var Native = window.AudioContext || window.webkitAudioContext;
        if (!Native) return;
        window.__gameAudioContexts = [];
        var Recorded = function (options) {
          var context = options !== undefined ? new Native(options) : new Native();
          window.__gameAudioContexts.push(context);
          return context;
        };
        Recorded.prototype = Native.prototype;
        if (window.AudioContext) window.AudioContext = Recorded;
        if (window.webkitAudioContext) window.webkitAudioContext = Recorded;
      })();

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var progressFill = document.querySelector("#unity-progress-fill");
      var warningBanner = document.querySelector("#unity-warning");

      // The canvas covers the whole visible screen. Its height is 100dvh (style.css): the height that is really
      // visible with or without the phone browser's address bar, so the game is never cut off and never leaves a
      // gap when the bar shows or hides, and it fills the screen in full screen. Unity matches its render size to the
      // canvas, so the game re-lays out on every resize, rotation and full-screen change; the page never scrolls.
      // Two exceptions size it in pixels instead: browsers without dvh, and an open on-screen keyboard (login
      // fields), which only shrinks the visual viewport — the game then fits above the keyboard as before.
      var dvh = !!(window.CSS && CSS.supports && CSS.supports("height", "100dvh"));
      function fitCanvas() {
        var viewport = window.visualViewport;
        var keyboard = !!viewport && viewport.height < window.innerHeight * 0.75;
        if (dvh && !keyboard) {
          container.style.width = container.style.height = canvas.style.width = canvas.style.height = "";
          return;
        }
        var w = window.innerWidth, h = window.innerHeight;
        if (viewport) { w = Math.round(viewport.width); h = Math.round(viewport.height); }
        container.style.width = w + "px";
        container.style.height = h + "px";
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      fitCanvas();
      window.gameFitCanvas = fitCanvas;   // WebFullscreen.jslib re-fits after entering full screen and locking landscape
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", function () { setTimeout(fitCanvas, 120); setTimeout(fitCanvas, 500); });
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitCanvas);
      // Entering / leaving full screen (Assets/Plugins/WebGL/WebFullscreen.jslib, the pause menu's 「全螢幕」).
      ["fullscreenchange", "webkitfullscreenchange"].forEach(function (type) {
        document.addEventListener(type, function () { fitCanvas(); setTimeout(fitCanvas, 150); setTimeout(fitCanvas, 600); });
      });

      // The notes on the login screen (the game calls window.gameHomeScreenTip(true) there, false elsewhere):
      // iPhone Safari: 「加入主畫面」 (「×」 remembered for good). In-app browsers: 「建議用 Chrome 或 Safari 開啟」,
      // already while loading (「×」 remembered for this visit).
      (function () {
        var tip = document.querySelector("#home-tip");
        var ua = navigator.userAgent || "";
        var iphone = /iPhone|iPod/.test(ua);
        var safari = /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|Line\/|FBAN|FBAV|Instagram/.test(ua);
        var fromHomeScreen = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches);
        var key = "gameHomeTipClosed", closed = false;
        try { closed = window.localStorage.getItem(key) === "1"; } catch (e) {}
        var applies = iphone && safari && !fromHomeScreen && !window.gameInAppBrowser.inApp;

        var inAppTip = document.querySelector("#inapp-tip");
        var inAppKey = "gameInAppTipClosed", inAppClosed = false;
        try { inAppClosed = window.sessionStorage.getItem(inAppKey) === "1"; } catch (e) {}
        var inApp = window.gameInAppBrowser.inApp;
        if (window.gameInAppBrowser.line) {
          // LINE opens a link with openExternalBrowser=1 in the phone's own browser (Chrome / Safari).
          var open = document.querySelector("#inapp-tip-open");
          var url = location.href.replace(/#.*$/, "");
          url += (url.indexOf("?") >= 0 ? "&" : "?") + "openExternalBrowser=1";
          open.href = url;
          open.hidden = false;
        }
        inAppTip.hidden = !(inApp && !inAppClosed);   // while loading

        window.gameHomeScreenTip = function (show) {
          tip.hidden = !(show && applies && !closed);
          inAppTip.hidden = !(show && inApp && !inAppClosed);
        };
        document.querySelector("#home-tip-close").addEventListener("click", function () {
          closed = true;
          try { window.localStorage.setItem(key, "1"); } catch (e) {}
          tip.hidden = true;
        });
        document.querySelector("#inapp-tip-close").addEventListener("click", function () {
          inAppClosed = true;
          try { window.sessionStorage.setItem(inAppKey, "1"); } catch (e) {}
          inAppTip.hidden = true;
        });
      })();

      // Keep touches for the game: no page scroll, pull-to-refresh, long-press menu or pinch zoom (touch-action: none
      // in the CSS stops double-tap zoom). touchend is left alone so Unity's on-screen keyboard can still open for
      // the login fields; Unity reads the touches itself either way.
      // On the map one finger holds the joystick while another taps 進入: Safari's pinch events and double-click
      // zoom are blocked too, so two fingers on the canvas never zoom or scroll the page.
      ["touchstart", "touchmove", "gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
        canvas.addEventListener(type, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
      });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      canvas.addEventListener("dblclick", function (e) { e.preventDefault(); });
      document.addEventListener("keydown", function (e) {
        // Space and the arrow keys are game controls; do not let them scroll the page.
        if ([" ", "Spacebar", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) >= 0) e.preventDefault();
      }, { passive: false });

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.className = type == "error" ? "error" : "warning";
        warningBanner.appendChild(div);
        warningBanner.style.display = "block";
        if (type != "error") setTimeout(function () { warningBanner.removeChild(div); if (!warningBanner.children.length) warningBanner.style.display = "none"; }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/54c48c35e310854d0130f579903274d9.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/9cfe0cd98cafc5c358f6b952324d7372.data.unityweb",
        frameworkUrl: buildUrl + "/045be081328e655132de8aa5a396fb9a.framework.js.unityweb",
        codeUrl: buildUrl + "/4dbe8d5cef65448eb833434e81089cf1.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "RPG2023",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        // Unity follows the canvas size (on by default); cap the pixel ratio so phones stay smooth.
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFill.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          fitCanvas();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
